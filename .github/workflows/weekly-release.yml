name: Weekly Release (reusable)

# Cuts a release on a cadence by merging the Release Please PR that accumulates on
# main. Release Please keeps that PR current on every merge; this job just lands
# it on schedule. No releasable commits since the last release -> no open PR -> the
# job no-ops.
#
# The merge uses the release bot app token (the same app release-please.yml pushes
# with), so it is a real push to main: Release Please tags + publishes the release
# through its own push trigger. No explicit dispatch is needed.
#
# Callers keep their own `schedule:` trigger; this template only defines the job.

on:
  workflow_call:
    inputs:
      app-id:
        description: "The release bot GitHub App's ID (caller passes vars.RELEASE_APP_ID)"
        required: true
        type: string
      runner:
        description: "JSON runs-on value, e.g. \"ubuntu-latest\" or [\"self-hosted\", \"linux\"]"
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      app-private-key:
        required: true

permissions: {}

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Merge pending release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No pending release PR — nothing to release this week."
            exit 0
          fi

          branch=$(gh pr view "$pr" --json headRefName --jq .headRefName)

          # Strict "up to date" branch protection refuses the merge otherwise.
          # Release Please rebuilds the branch only when the PR content changes,
          # so commits hidden from the changelog (ci, chore, ...) can leave it
          # behind main.
          behind() { gh api "repos/$GH_REPO/compare/main...$branch" --jq .behind_by; }
          if [[ "$(behind)" -gt 0 ]]; then
            echo "Release branch is behind main — updating it"
            gh pr update-branch "$pr"
            for _ in $(seq 1 24); do
              [[ "$(behind)" -eq 0 ]] && break
              sleep 5
            done
            [[ "$(behind)" -eq 0 ]] || { echo "Release branch is still behind main"; exit 1; }
          fi

          sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)

          # The release branch gets its checks from pull_request runs on every
          # push to it. Poll them over REST on the commit: `gh pr checks` walks
          # GraphQL checkSuite.workflowRun, which needs actions:read and fails
          # on private repos under the app token (checks:read + statuses:read
          # only). Success, neutral and skipped pass; any other conclusion, or
          # a failing commit status, aborts before the merge. The job timeout
          # bounds the wait.
          started=$SECONDS
          while true; do
            runs=$(gh api --paginate "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')
            statuses=$(gh api "repos/$GH_REPO/commits/$sha/status" \
              --jq '[.state, .total_count] | @tsv')
            status_state=${statuses%%$'\t'*}
            status_count=${statuses##*$'\t'}

            bad=$(awk -F'\t' '$2 == "completed" && $3 !~ /^(success|neutral|skipped)$/ {print $1 " (" $3 ")"}' <<<"$runs")
            if [[ -n "$bad" ]]; then
              echo "Check failed:"; echo "$bad"
              exit 1
            fi
            if [[ "$status_state" == "failure" || "$status_state" == "error" ]]; then
              echo "Commit status is $status_state"
              exit 1
            fi

            total=$(grep -c . <<<"$runs" || true)
            pending=$(awk -F'\t' '$2 != "completed"' <<<"$runs" | grep -c . || true)
            status_pending=0
            [[ "$status_count" -gt 0 && "$status_state" != "success" ]] && status_pending=1

            if [[ $((total + status_count)) -gt 0 && "$pending" -eq 0 && "$status_pending" -eq 0 ]]; then
              echo "All $total check run(s) passed; commit status: ${status_state} ($status_count)"
              break
            fi
            # A branch update just above needs a moment to register its checks.
            if [[ $((total + status_count)) -eq 0 && $((SECONDS - started)) -gt 120 ]]; then
              echo "No checks reported on $sha"
              exit 1
            fi
            echo "Waiting: $pending check run(s) and $status_pending status(es) still pending"
            sleep 10
          done

          echo "Merging release PR #$pr at $sha"
          # --match-head-commit: refuse to merge anything but the commit the
          # checks above just passed.
          gh pr merge "$pr" --squash --delete-branch --match-head-commit "$sha"

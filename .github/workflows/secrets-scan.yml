name: Secrets Scan (reusable)

# The OSS gitleaks BINARY (MIT-licensed) rather than gitleaks/gitleaks-action, which
# requires a paid license for org-owned repos. The binary is pinned by version + a
# per-arch sha256, the download is retried, and the binary is cached so a network
# flake reads as "download failed (infra)", never as a secrets finding.

on:
  workflow_call:
    inputs:
      mode:
        description: "'dir' scans the working tree; 'git' scans full history"
        required: false
        type: string
        default: "dir"
      runner:
        description: "JSON runs-on value, e.g. \"ubuntu-latest\" or [\"self-hosted\", \"linux\"]"
        required: false
        type: string
        default: '"ubuntu-latest"'

permissions: {}

env:
  GITLEAKS_VERSION: "8.21.2"
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_<arch>.tar.gz from the official
  # release asset gitleaks_${GITLEAKS_VERSION}_checksums.txt at
  # https://github.com/gitleaks/gitleaks/releases/tag/v8.21.2
  GITLEAKS_SHA256_X64: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  GITLEAKS_SHA256_ARM64: "654c935542c89f565aabe7bf7c6c500830f116c114f0aeb509d2460c1ac2e6da"

jobs:
  secrets-scan:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.mode == 'git' && 0 || 1 }}

      - name: Resolve arch
        id: arch
        run: |
          case "$(uname -m)" in
            aarch64|arm64) echo "gl_arch=arm64" >> "$GITHUB_OUTPUT" ;;
            x86_64|amd64)  echo "gl_arch=x64"   >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac

      # actions/cache works on hosted runners; a persistent self-hosted runner
      # keeps its own local cache dir instead, since nothing has to go over the
      # network there.
      - name: Cache gitleaks binary (hosted)
        if: runner.environment == 'github-hosted'
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/gitleaks/${{ env.GITLEAKS_VERSION }}
          key: gitleaks-${{ steps.arch.outputs.gl_arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Fetch gitleaks binary
        env:
          GL_ARCH: ${{ steps.arch.outputs.gl_arch }}
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/gitleaks/${GITLEAKS_VERSION}"
          TARBALL="${CACHE_DIR}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          if [[ "$GL_ARCH" == "arm64" ]]; then
            SHA256="$GITLEAKS_SHA256_ARM64"
          else
            SHA256="$GITLEAKS_SHA256_X64"
          fi
          mkdir -p "${CACHE_DIR}"
          if ! echo "${SHA256}  ${TARBALL}" | sha256sum -c --status 2>/dev/null; then
            if ! curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
                "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz" \
                -o "${TARBALL}.tmp"; then
              echo "::error::gitleaks download failed (infra) — NOT a secrets finding; retry the job"
              exit 1
            fi
            if ! echo "${SHA256}  ${TARBALL}.tmp" | sha256sum -c --status; then
              echo "::error::gitleaks download checksum mismatch (infra) — NOT a secrets finding"
              rm -f "${TARBALL}.tmp"
              exit 1
            fi
            mv "${TARBALL}.tmp" "${TARBALL}"
          fi
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "git" ]]; then
            ./gitleaks git --no-banner --redact --exit-code 1 "$GITHUB_WORKSPACE"
          else
            ./gitleaks dir . --no-banner --redact --exit-code 1
          fi

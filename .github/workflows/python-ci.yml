name: Python CI (reusable)

on:
  workflow_call:
    inputs:
      install:
        description: "pip install target, e.g. \"-e .[dev]\""
        required: true
        type: string
      run:
        description: "The command(s) to run"
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"
      runner:
        description: "JSON runs-on value, e.g. \"ubuntu-latest\" or [\"self-hosted\", \"linux\"]"
        required: false
        type: string
        default: '"ubuntu-latest"'
      cache-key-files:
        description: "Glob(s) hashFiles uses to key the self-hosted venv cache"
        required: false
        type: string
        default: "pyproject.toml\nrequirements*.txt"

permissions: {}

jobs:
  python-ci:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Hosted runners get provisioned Python + pip caching from setup-python.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install (hosted)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ${{ inputs.install }}

      # setup-python cannot provision a Python it doesn't already have a build for
      # on some self-hosted architectures. Reuse a persistent venv instead of
      # actions/cache: a local directory beats a network round trip on a
      # persistent runner. A Python venv is not relocatable - every console
      # script (pip, mypy, pytest, ...) bakes an absolute shebang to the path it
      # was created at - so the venv is built directly at its final cache path
      # instead of in a temp dir that gets moved. A ".ci-venv-ok" marker holding
      # that same path is written only after install succeeds, so a cache hit
      # is rejected and the venv rebuilt from scratch when: the marker is
      # missing (e.g. install failed, or was silently truncated by nullglob
      # eating an extras token); or the marker's recorded path doesn't match
      # the current venv_dir, which also self-heals a v1.0.1-era venv that was
      # built in a temp dir and moved (its console scripts still point at the
      # vanished temp path even though a marker is present).
      - name: Install (self-hosted)
        if: runner.environment != 'github-hosted'
        env:
          CACHE_KEY_FILES: ${{ inputs.cache-key-files }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          key_files=()
          while IFS= read -r glob; do
            [[ -z "$glob" ]] && continue
            for f in $glob; do key_files+=("$f"); done
          done <<< "$CACHE_KEY_FILES"
          shopt -u nullglob
          if [[ "${#key_files[@]}" -eq 0 ]]; then
            hash="none"
          else
            hash=$(sort <<< "${key_files[*]}" | xargs sha256sum | sha256sum | cut -d' ' -f1)
          fi
          venv_dir="$HOME/.cache/ci-venv/${{ github.event.repository.name }}/${hash}"
          marker="${venv_dir}/.ci-venv-ok"
          stale=0
          if [[ ! -x "${venv_dir}/bin/python" || ! -f "${marker}" ]]; then
            stale=1
          elif [[ "$(cat "${marker}")" != "${venv_dir}" ]]; then
            stale=1
          fi
          if [[ "${stale}" -eq 1 ]]; then
            rm -rf "${venv_dir}"
            mkdir -p "$(dirname "${venv_dir}")"
            python3 -m venv "${venv_dir}"
            "${venv_dir}/bin/pip" install --quiet --upgrade pip
            "${venv_dir}/bin/pip" install --quiet ${{ inputs.install }}
            echo "${venv_dir}" > "${marker}"
          fi
          echo "${venv_dir}/bin" >> "$GITHUB_PATH"

      - name: Run
        run: ${{ inputs.run }}

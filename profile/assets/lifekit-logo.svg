<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="lifekit logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#182742"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- stacked layers: the stack -->
  <rect x="122" y="316" width="268" height="58" rx="29" fill="url(#accent)"/>
  <rect x="146" y="228" width="220" height="58" rx="29" fill="url(#accent)" opacity="0.78"/>
  <rect x="170" y="140" width="118" height="58" rx="29" fill="url(#accent)" opacity="0.58"/>

  <!-- federated peer: detached node joined by a thin declared edge -->
  <line x1="300" y1="169" x2="330" y2="169" stroke="#5eead4" stroke-width="10" stroke-linecap="round"/>
  <circle cx="356" cy="169" r="27" fill="none" stroke="#5eead4" stroke-width="12"/>
</svg>
